<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Python 迭代 (1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>

/* Layout: an exam-paper workbench — code sheet on the left, readouts on the right, a ruled trace table underneath.
   Colours come from the marking desk: blue answer ink, red correction pen, a yellow highlighter for "the line we are on". */
:root {
  --paper: #EDF0EC;
  --sheet: #FFFFFF;
  --sheet-2: #F6F8F5;
  --ink: #17202A;
  --muted: #56626D;
  --rule: #D2D9D3;
  --rule-strong: #A9B4AC;
  --pen: #1C4C9C;
  --pen-soft: #E1E9F6;
  --red: #BF321E;
  --red-soft: #FAE4E0;
  --green: #1B7142;
  --green-soft: #DDEFE3;
  --amber: #9A5A00;
  --amber-soft: #FAEED6;
  --kw: #78308C;
  --hl: #FFE14F;
  --hl-line: #FFF2A1;
  --shadow: 0 1px 0 rgba(23, 32, 42, .06), 0 2px 8px rgba(23, 32, 42, .05);
  --f-display: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", "Noto Sans TC", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151A; --sheet: #1A2027; --sheet-2: #151A20; --ink: #E3E8EC; --muted: #95A1AC;
    --rule: #2A323B; --rule-strong: #3D4752; --pen: #8EB3F4; --pen-soft: #1B2940; --red: #FF8E79; --red-soft: #3A1E19;
    --green: #70D39A; --green-soft: #14301F; --amber: #F0B152; --amber-soft: #35280E; --kw: #D59CE6;
    --hl: #E5C43A; --hl-line: #3B3511; --shadow: 0 1px 0 rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151A; --sheet: #1A2027; --sheet-2: #151A20; --ink: #E3E8EC; --muted: #95A1AC;
  --rule: #2A323B; --rule-strong: #3D4752; --pen: #8EB3F4; --pen-soft: #1B2940; --red: #FF8E79; --red-soft: #3A1E19;
  --green: #70D39A; --green-soft: #14301F; --amber: #F0B152; --amber-soft: #35280E; --kw: #D59CE6;
  --hl: #E5C43A; --hl-line: #3B3511; --shadow: 0 1px 0 rgba(0, 0, 0, .3); color-scheme: dark;
}
html { font-size: 16px; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.6; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
code, pre, .mono { font-family: var(--f-code); }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; }

/* ---------- Header ---------- */
.top { padding-block: 18px 0; }
.top-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.eyebrow { font-size: .8rem; letter-spacing: .08em; color: var(--muted); margin: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 2.1rem; line-height: 1.2; margin: 2px 0 0; text-wrap: balance; }
h1 .py { color: var(--pen); }
.size-ctl { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.size-ctl button { width: 2.2rem; height: 2rem; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); cursor: pointer; font-weight: 700; }
.size-ctl button:hover { border-color: var(--pen); color: var(--pen); }
.tabs { display: flex; gap: 4px; margin-top: 14px; border-bottom: 2px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; background: none; border: 0; padding: 10px 16px 9px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tabs button .n { font-family: var(--f-code); font-size: .8em; margin-right: 6px; color: var(--rule-strong); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pen); }
.tabs button[aria-selected="true"] .n { color: var(--pen); }
.tabs button:hover { color: var(--ink); }
main { padding-block: 20px 48px; }
section.tab { display: grid; gap: 16px; }

/* ---------- Generic pieces ---------- */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.sheet-head h2, .sheet-head h3 { margin: 0; font-size: .82rem; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
.sheet-body { padding: 14px; }
h2.sec { font-family: var(--f-display); font-size: 1.45rem; margin: 0; font-weight: 700; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); max-width: 68ch; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule-strong); background: var(--sheet); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; line-height: 1.3; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--pen); color: var(--pen); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--sheet); }
.btn.small { padding: 3px 9px; font-size: .85rem; }
.chip { display: inline-block; font-size: .72rem; font-family: var(--f-code); padding: 1px 6px; border-radius: 4px; background: var(--sheet-2); border: 1px solid var(--rule); color: var(--muted); }
.t-true { color: var(--green); font-weight: 600; }
.t-false { color: var(--red); font-weight: 600; }
.kbd { font-family: var(--f-code); font-size: .75rem; border: 1px solid var(--rule-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }

/* code highlight */
.k { color: var(--kw); font-weight: 600; }
.b { color: var(--pen); }
.s { color: var(--green); }
.nu { color: var(--amber); }
.c { color: var(--muted); font-style: italic; }

/* ---------- Tracer ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.toolbar label.sel { display: flex; align-items: center; gap: 8px; font-weight: 500; }
select { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 6px 30px 6px 10px; max-width: 100%; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-weight: 500; }
.toggle input { appearance: none; width: 2.4rem; height: 1.35rem; border-radius: 999px; background: var(--rule-strong); position: relative; cursor: pointer; transition: background .15s; margin: 0; flex: none; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.35rem - 4px); height: calc(1.35rem - 4px); border-radius: 50%; background: var(--sheet); transition: transform .15s; }
.toggle input:checked { background: var(--pen); }
.toggle input:checked::after { transform: translateX(1.05rem); }
.focus { margin: 0; padding: 10px 14px; background: var(--sheet); border: 1px dashed var(--rule-strong); border-radius: var(--r); max-width: none; }
.focus .tag { font-family: var(--f-display); font-weight: 700; color: var(--red); margin-right: 6px; }

.trace-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.code-col, .side-col { display: grid; gap: 12px; min-width: 0; }
.code-view { font-family: var(--f-code); font-size: .95rem; line-height: 1.75; padding: 8px 0; overflow-x: auto; }
.ln { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: stretch; min-width: max-content; }
.ln .gut { display: flex; align-items: center; gap: 0; padding-left: 6px; color: var(--rule-strong); user-select: none; }
.ln .arrow { width: 1.2rem; text-align: center; color: transparent; font-size: .8rem; }
.ln .num { width: 2.1rem; text-align: right; padding-right: 10px; font-size: .85em; }
.ln .bars { display: flex; gap: 3px; width: 26px; justify-content: flex-end; padding-right: 6px; align-self: stretch; }
.ln .bars i { width: 4px; background: transparent; }
.ln .bars i.on { background: var(--pen); opacity: .85; }
.ln .bars i.idle { background: var(--rule); }
.ln .src { white-space: pre; padding-right: 16px; }
.ln .cnt { font-size: .72rem; color: var(--muted); padding: 0 12px; align-self: center; font-variant-numeric: tabular-nums; min-width: 3rem; text-align: right; }
.ln.cur { background: var(--hl-line); }
.ln.cur .arrow { color: var(--ink); }
.ln.cur .num { color: var(--ink); font-weight: 600; }
.ln.err { background: var(--red-soft); }
.ln.err .arrow { color: var(--red); }
.editor { padding: 10px 12px; display: grid; gap: 8px; }
.editor textarea { width: 100%; min-height: 16rem; font-family: var(--f-code); font-size: .95rem; line-height: 1.7; padding: 10px 12px; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--sheet-2); resize: vertical; tab-size: 4; white-space: pre; overflow-x: auto; }
.editor .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.editor .hint { font-size: .82rem; color: var(--muted); }
.inputs-row { border-top: 1px solid var(--rule); padding: 10px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: start; }
.inputs-row label { font-size: .85rem; font-weight: 500; padding-top: 4px; }
.inputs-row label small { display: block; color: var(--muted); font-weight: 400; }
.inputs-row textarea { font-family: var(--f-code); font-size: .9rem; border: 1px solid var(--rule-strong); border-radius: var(--r); padding: 4px 8px; background: var(--sheet-2); resize: vertical; min-height: 2.4rem; width: 100%; }

.controls { display: grid; gap: 8px; padding: 10px 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.controls .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.controls .grow { flex: 1; }
.controls .count { font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--muted); white-space: nowrap; }
.controls .count b { color: var(--ink); }
input[type="range"] { width: 100%; accent-color: var(--pen); margin: 0; }
.speed { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; color: var(--muted); }
.speed select { padding: 3px 26px 3px 8px; font-size: .85rem; }

.predict { border: 2px solid var(--pen); border-radius: var(--r); background: var(--pen-soft); padding: 12px 14px; display: grid; gap: 10px; }
.predict .q { font-weight: 500; margin: 0; }
.predict .q code { background: var(--sheet); padding: 1px 5px; border-radius: 4px; }
.predict .ans { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.predict input[type="text"] { font-family: var(--f-code); border: 1px solid var(--rule-strong); border-radius: var(--r); padding: 5px 10px; background: var(--sheet); min-width: 0; flex: 1 1 10rem; max-width: 22rem; }
.predict .fb { margin: 0; font-weight: 500; }
.predict .fb.ok { color: var(--green); }
.predict .fb.no { color: var(--red); }
.predict .score { font-size: .82rem; color: var(--muted); }

.note { padding: 12px 14px; display: grid; gap: 8px; }
.note .where { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.note .where code { color: var(--ink); background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; font-size: .9rem; }
.note .main { margin: 0; font-size: 1.05rem; }
.note .eval { font-family: var(--f-code); font-size: .95rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 10px; }
.note .eval .ar { color: var(--muted); }
.note .eval .res { background: var(--hl); color: #17202A; padding: 0 6px; border-radius: 3px; font-weight: 600; }
.note.error .main { color: var(--red); }
.note .why { margin: 0; font-size: .9rem; color: var(--muted); }

.vars { padding: 12px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 8px; }
.var { border: 1px solid var(--rule); border-radius: var(--r); padding: 6px 10px 8px; background: var(--sheet-2); min-width: 0; transition: background .25s; }
.var .nm { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-family: var(--f-code); font-weight: 600; font-size: .9rem; }
.var .val { font-family: var(--f-code); font-size: 1.35rem; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.var .old { font-family: var(--f-code); font-size: .8rem; color: var(--muted); min-height: 1.2em; overflow-wrap: anywhere; }
.var .old s { text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.var.changed { background: var(--hl-line); border-color: var(--hl); }
.empty { color: var(--muted); font-size: .9rem; padding: 12px 14px; margin: 0; }

.loops { padding: 12px 14px; display: grid; gap: 8px; }
.loop { border-left: 4px solid var(--pen); padding: 4px 10px; background: var(--sheet-2); border-radius: 0 var(--r) var(--r) 0; }
.loop .l1 { font-family: var(--f-code); font-size: .85rem; color: var(--muted); }
.loop .l2 { font-weight: 500; }
.loop .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.loop .dots span { min-width: 1.6rem; height: 1.6rem; padding: 0 4px; border-radius: 4px; border: 1px solid var(--rule-strong); display: grid; place-items: center; font-family: var(--f-code); font-size: .75rem; color: var(--muted); }
.loop .dots span.done { background: var(--pen-soft); border-color: var(--pen); color: var(--pen); }
.loop .dots span.now { background: var(--pen); border-color: var(--pen); color: var(--sheet); font-weight: 600; }
.loop.inner { margin-left: 14px; }

.out { margin: 0; padding: 12px 14px; font-family: var(--f-code); font-size: .95rem; line-height: 1.55; min-height: 5rem; max-height: 18rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; background: var(--sheet-2); border-radius: 0 0 var(--r) var(--r); }
.out mark { background: var(--hl); color: #17202A; border-radius: 2px; }
.out .cursor { display: inline-block; width: .55em; height: 1.1em; background: var(--muted); vertical-align: text-bottom; opacity: .5; }

.table-wrap { overflow: auto; max-height: 26rem; }
table.tt { border-collapse: collapse; font-family: var(--f-code); font-size: .9rem; min-width: 100%; font-variant-numeric: tabular-nums; }
table.tt th { position: sticky; top: 0; background: var(--sheet-2); z-index: 1; font-weight: 600; text-align: center; padding: 6px 12px; border-bottom: 2px solid var(--rule-strong); white-space: nowrap; }
table.tt th.var-col { color: var(--pen); }
table.tt td { padding: 4px 12px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); text-align: center; white-space: nowrap; }
table.tt td:last-child, table.tt th:last-child { border-right: 0; text-align: left; }
table.tt td.dim { color: var(--muted); opacity: .55; }
table.tt td.chg { font-weight: 600; }
table.tt td.meta { color: var(--muted); font-size: .8rem; }
table.tt tbody tr { cursor: pointer; }
table.tt tbody tr:hover { background: var(--sheet-2); }
table.tt tbody tr.cur { background: var(--hl-line); }
table.tt td.out-cell { max-width: 18rem; overflow: hidden; text-overflow: ellipsis; }

/* ---------- range explorer ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--sheet); padding: 6px 12px; cursor: pointer; font-family: var(--f-code); font-size: .88rem; border-right: 1px solid var(--rule-strong); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--pen); color: var(--sheet); }
.params { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-top: 14px; }
.param { display: grid; gap: 4px; }
.param label { font-family: var(--f-code); font-size: .85rem; color: var(--muted); }
.stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--rule-strong); border-radius: var(--r); overflow: hidden; background: var(--sheet); }
.stepper button { border: 0; background: var(--sheet-2); width: 2.2rem; cursor: pointer; font-weight: 700; font-size: 1.05rem; }
.stepper button:hover:not(:disabled) { color: var(--pen); }
.stepper input { width: 3.6rem; text-align: center; border: 0; border-inline: 1px solid var(--rule); font-family: var(--f-code); font-size: 1.05rem; padding: 4px 0; background: var(--sheet); -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.param.off { opacity: .45; }
.range-code { margin: 16px 0 0; padding: 12px 14px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: var(--r); font-size: 1.1rem; overflow-x: auto; }
.numline-wrap { overflow-x: auto; margin-top: 14px; padding-bottom: 4px; }
.numline { display: flex; min-width: max-content; padding: 0 4px; }
.cell { width: 2.6rem; flex: none; display: grid; grid-template-rows: 2.1rem 1.4rem 1.8rem 1.6rem; justify-items: center; align-items: center; position: relative; }
.cell .dot { width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--pen); color: var(--sheet); display: grid; place-items: center; font-family: var(--f-code); font-weight: 600; font-size: .8rem; }
.cell .tick { width: 100%; height: 100%; position: relative; }
.cell .tick::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--rule-strong); }
.cell .tick::after { content: ""; position: absolute; left: 50%; top: 25%; bottom: 25%; border-left: 2px solid var(--rule-strong); }
.cell.hit .tick::after { border-color: var(--pen); }
.cell .num { font-family: var(--f-code); font-size: .9rem; color: var(--muted); }
.cell.hit .num { color: var(--ink); font-weight: 600; }
.cell .lab { font-size: .68rem; line-height: 1.1; text-align: center; white-space: nowrap; }
.cell.stop .num { color: var(--red); font-weight: 600; }
.cell .x { color: var(--red); font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; }
.cell .lab.start { color: var(--pen); }
.cell .lab.stop { color: var(--red); }
.range-result { margin-top: 12px; display: grid; gap: 6px; }
.range-result .seq { font-family: var(--f-code); font-size: 1.15rem; }
.range-result .msg { margin: 0; }
.range-result .msg.warn { color: var(--red); }
.formula { font-size: .85rem; color: var(--muted); }
.challenge .target { font-family: var(--f-code); font-size: 1.3rem; font-weight: 600; letter-spacing: .02em; margin: 6px 0; }
.challenge .status { font-weight: 500; margin: 0; }
.challenge .status.ok { color: var(--green); }
table.plain { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.plain th, table.plain td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
table.plain th { font-size: .8rem; letter-spacing: .06em; color: var(--muted); font-weight: 700; background: var(--sheet-2); }
table.plain code { white-space: nowrap; }
.note-hand { font-family: var(--f-display); color: var(--red); font-size: 1.05rem; margin: 10px 0 0; }

/* ---------- for vs while ---------- */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.codecard pre { margin: 0; padding: 14px 16px; font-size: 1.05rem; line-height: 1.9; overflow-x: auto; background: var(--sheet-2); }
.codecard .foot { padding: 10px 14px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
.p-init { box-shadow: inset 0 -3px 0 var(--green); background: var(--green-soft); border-radius: 2px; }
.p-cond { box-shadow: inset 0 -3px 0 var(--pen); background: var(--pen-soft); border-radius: 2px; }
.p-upd { box-shadow: inset 0 -3px 0 var(--amber); background: var(--amber-soft); border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .9rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.scen { display: grid; gap: 0; }

/* ---------- quiz ---------- */
.quiz { max-width: 860px; }

.opt:disabled { cursor: default; }
.opt.right { background: var(--green-soft); border-color: var(--green); }

.opt.wrong { background: var(--red-soft); border-color: var(--red); }
.opt.wrong .L { color: var(--red); }
.qexplain { margin: 0; padding: 10px 14px; border-left: 4px solid var(--pen); background: var(--pen-soft); border-radius: 0 var(--r) var(--r) 0; }
.qactions { display: flex; gap: 8px; flex-wrap: wrap; }
.qdone { padding: 24px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.qdone .big { font-family: var(--f-display); font-size: 2.6rem; font-weight: 700; color: var(--pen); line-height: 1.1; }

/* ---------- jumps, skips, tracked line ---------- */
.code-view { position: relative; }
.ln .gut { padding-left: 0; }
.ln .jmp { width: 22px; flex: none; }
.ln .num { width: 2.6rem; }
.ln .num.click { cursor: pointer; }
.ln .num.click:hover { color: var(--pen); text-decoration: underline; }
.ln.tracked .num { color: var(--pen); font-weight: 700; }
.ln.tracked .num::before { content: "◆ "; font-size: .65em; vertical-align: 1px; }
.ln.skip .src { opacity: .45; text-decoration: line-through; text-decoration-color: var(--muted); }
.ln.skip .src .jtag { text-decoration: none; display: inline-block; }
.ln.endline .src { color: var(--muted); font-style: italic; font-family: var(--f-body); }
.jtag { font-family: var(--f-body); font-style: normal; font-size: .72rem; margin-left: 14px; padding: 1px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; vertical-align: 1px; }

.jtag.skipped { background: var(--sheet-2); color: var(--muted); border: 1px solid var(--rule-strong); }
.jump-svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.jump-svg path { fill: none; stroke-width: 2.2; stroke-linejoin: round; }
.jump-svg.break path { stroke: var(--red); }
.jump-svg.break circle, .jump-svg.break polygon { fill: var(--red); }
.jump-svg.continue path { stroke: var(--amber); }
.jump-svg.continue circle, .jump-svg.continue polygon { fill: var(--amber); }
.jump-chip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-weight: 600; padding: 8px 10px; border-radius: var(--r); font-size: .95rem; }
.jump-chip.break { background: var(--red-soft); color: var(--red); }
.jump-chip.continue { background: var(--amber-soft); color: var(--amber); }
.jump-chip code { background: var(--sheet); color: var(--ink); border-radius: 4px; padding: 1px 6px; font-weight: 500; }

/* ---------- trace table controls ---------- */
.track-ctl { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.track-ctl label.sel { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 500; }
.track-ctl select { font-family: var(--f-code); font-size: .85rem; padding: 4px 28px 4px 8px; max-width: min(26rem, 70vw); }

.track-info b { color: var(--ink); }
table.tt td.code-cell { text-align: left; max-width: 17rem; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }

/* ---------- break / continue tab ---------- */
.rule .flow { margin: 0; padding: 12px 14px 14px 2.2rem; display: grid; gap: 4px; }
.rule .flow li::marker { font-family: var(--f-code); font-weight: 600; }
.rule-break .sheet-head { border-bottom-color: var(--red); }
.rule-break .sheet-head h3, .rule-break .flow li::marker { color: var(--red); }
.rule-cont .sheet-head { border-bottom-color: var(--amber); }
.rule-cont .sheet-head h3, .rule-cont .flow li::marker { color: var(--amber); }
.rule .sheet-head h3 { font-size: .95rem; letter-spacing: .02em; }
.rule .sheet-head h3 code { font-size: 1.05em; }
.bc-wrap { display: grid; gap: 12px; }
.bc-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bc-controls .count { margin-left: auto; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.bc-vars span.chg { background: var(--hl-line); border-color: var(--hl); }
.mini-panel .out { min-height: 4rem; max-height: 12rem; border-top: 1px solid var(--rule); border-radius: 0 0 var(--r) var(--r); }
.legend-line { margin: 0; font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.sw { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 4px; }
.sw-b { border-color: var(--red); }
.sw-c { border-color: var(--amber); }
.sw-s { border-top: 1px solid var(--muted); width: 22px; }
.pitfalls { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 12px; }
.goto .sheet-body { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* ---------- debugging tab ---------- */
.dbg-grid { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 16px; align-items: start; }
.dbg-list { padding: 6px; display: grid; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); }
.dbg-list button { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr) 1.2rem; align-items: center; gap: 6px; text-align: left; border: 0; background: none; border-radius: var(--r); padding: 6px 8px; cursor: pointer; }
.dbg-list button:hover { background: var(--sheet-2); }
.dbg-list button.cur { background: var(--pen-soft); }
.dbg-list .qn { font-family: var(--f-code); font-size: .8rem; color: var(--muted); }
.dbg-list button.cur .qn { color: var(--pen); font-weight: 600; }
.dbg-list .qt { font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbg-list .st { color: var(--green); font-weight: 700; text-align: center; }
.dbg-list .prog { font-size: .8rem; color: var(--muted); padding: 6px 8px 4px; }
.dbg-body { padding: 14px; display: grid; gap: 14px; }
.task { margin: 0; font-size: 1.08rem; padding: 12px 14px; border-left: 4px solid var(--red); background: var(--red-soft); border-radius: 0 var(--r) var(--r) 0; }
.task .tag { font-family: var(--f-display); font-weight: 700; color: var(--red); margin-right: 6px; }
.dbg-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.lab { font-size: .8rem; letter-spacing: .08em; font-weight: 700; color: var(--muted); margin: 0 0 6px; display: block; }
.ex-src { width: 100%; min-height: 10rem; font-family: var(--f-code); font-size: .95rem; line-height: 1.7; padding: 10px 12px; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--sheet-2); resize: vertical; tab-size: 4; white-space: pre; overflow-x: auto; }
.dbg-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.out.expect { border: 1px solid var(--rule); border-radius: var(--r); min-height: 3rem; max-height: 14rem; }
.tests-note { font-size: .82rem; color: var(--muted); margin: 6px 0 0; }
.verdict { padding: 10px 14px; border-radius: var(--r); font-weight: 600; margin: 0; }
.verdict.ok { background: var(--green-soft); color: var(--green); }
.verdict.no { background: var(--red-soft); color: var(--red); }
.verdict small { display: block; font-weight: 400; color: var(--ink); margin-top: 2px; }
.diff-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); }
table.diff { border-collapse: collapse; width: 100%; font-family: var(--f-code); font-size: .88rem; }
table.diff th { background: var(--sheet-2); font-family: var(--f-body); font-size: .8rem; color: var(--muted); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule-strong); }
table.diff td { padding: 3px 10px; border-bottom: 1px solid var(--rule); white-space: pre; vertical-align: top; }
table.diff td.n { color: var(--muted); width: 2.5rem; text-align: right; }
table.diff tr.bad td.act { background: var(--red-soft); color: var(--red); }
table.diff tr.bad td.exp { background: var(--green-soft); }
table.diff td.miss { color: var(--muted); font-style: italic; font-family: var(--f-body); }
.hints { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.hints li { padding: 8px 12px; background: var(--amber-soft); border-radius: var(--r); }
.hints li b { color: var(--amber); margin-right: 6px; }
.answer { border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.answer pre { margin: 0; padding: 10px 0; background: var(--sheet-2); font-size: .95rem; line-height: 1.7; overflow-x: auto; }
.answer pre .aline { display: block; padding: 0 12px; }
.answer pre .aline.add { background: var(--green-soft); box-shadow: inset 3px 0 0 var(--green); }
.answer p { margin: 0; padding: 10px 12px; }
.dbg-nav { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--rule); padding-top: 12px; }
.back-btn { margin-left: 10px; }

@media (max-width: 980px) {
  .dbg-grid { grid-template-columns: minmax(0, 1fr); }

  .dbg-list .qt { display: none; }
  .dbg-list .prog { width: 100%; }
  .dbg-cols { grid-template-columns: minmax(0, 1fr); }
}

.kbd-help { font-size: .8rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

}

  h1 { font-size: 1.6rem; }

}

.top-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lang-link { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 4px 12px; color: var(--ink); text-decoration: none; font-weight: 500; font-size: .9rem; cursor: pointer; font-family: var(--f-body); }

.r-steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }

.cell .cand { width: 1.9rem; height: 1.9rem; border-radius: 50%; border: 2px dashed var(--red); color: var(--red); display: grid; place-items: center; font-family: var(--f-code); font-weight: 700; font-size: .8rem; }
.r-explain { margin-top: 12px; padding: 10px 14px; border-radius: var(--r); background: var(--sheet-2); border: 1px solid var(--rule); display: grid; gap: 4px; }
.r-explain .main { margin: 0; font-size: 1.05rem; }

.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

.strip .lbl { width: 100%; font-size: .75rem; color: var(--muted); letter-spacing: .04em; }
.strip .it { display: grid; justify-items: center; gap: 2px; }
.strip .it .box { min-width: 2.2rem; height: 2.2rem; padding: 0 6px; border: 1.5px solid var(--rule-strong); border-radius: 4px; display: grid; place-items: center; font-family: var(--f-code); font-size: .9rem; background: var(--sheet); white-space: pre; }
.strip .it .ix { font-family: var(--f-code); font-size: .68rem; color: var(--muted); }
.strip .it.done .box { background: var(--pen-soft); border-color: var(--pen); color: var(--pen); }
.strip .it.now .box { background: var(--pen); border-color: var(--pen); color: var(--sheet); font-weight: 600; box-shadow: 0 0 0 3px var(--hl); }
.strip .it.now .ix { color: var(--pen); font-weight: 700; }
.lv { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px 0; font-size: .92rem; }
.lv .v { font-family: var(--f-code); font-size: 1.1rem; font-weight: 600; background: var(--hl-line); border: 1px solid var(--hl); padding: 0 8px; border-radius: 4px; }
.notes4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 12px; }
.mistake .res-line { font-family: var(--f-code); font-size: .85rem; color: var(--ink); background: var(--sheet-2); border-radius: 4px; padding: 4px 8px; }

/* exercises sample */
.sample { display: grid; gap: 6px; }
.sample .io-in { font-size: .85rem; color: var(--muted); margin: 0; }
.req { display: inline-block; font-size: .78rem; font-family: var(--f-code); padding: 1px 8px; border-radius: 999px; background: var(--pen-soft); color: var(--pen); font-weight: 600; margin-left: 8px; vertical-align: 2px; }

@media (max-width: 640px) { .r-io { grid-template-columns: minmax(0, 1fr); } .r-steps .count { margin-left: 0; width: 100%; } }

">\n        <h3>{{pit2Title}}</h3>\n        <pre data-hl=\"pit2\"></pre>\n        <p>{{pit2Text}}</p>\n        <button type=\"button\" class=\"btn small\" data-dbg=\"8\">{{doDebug}} ▶</button>\n      </div>\n      <div class=\"sheet mistake\">\n        <h3>{{pit3Title}}</h3>\n        <pre data-hl=\"pit3\"></pre>\n        <p>{{pit3Text}}</p>\n      </div>\n    </div>\n  </section>\n\n  <!-- ===================== 5. coding tasks ===================== -->\n  <section class=\"tab\" id=\"tab-write\" role=\"tabpanel\" aria-labelledby=\"t-write\" hidden>\n    <div>\n      <h2 class=\"sec\">{{writeTitle}}</h2>\n      <p class=\"lead\">{{writeLead}}</p>\n    </div>\n    <div class=\"dbg-grid\">\n      <nav class=\"sheet dbg-list\" id=\"wrList\" aria-label=\"{{taskList}}\"></nav>\n      <div class=\"sheet dbg-main\" id=\"wrMain\"></div>\n    </div>\n  </section>\n\n  <!-- ===================== 6. debugging ===================== -->\n  <section class=\"tab\" id=\"tab-debug\" role=\"tabpanel\" aria-labelledby=\"t-debug\" hidden>\n    <div>\n      <h2 class=\"sec\">{{debugTitle}}</h2>\n      <p class=\"lead\">{{debugLead}}</p>\n    </div>\n    <div class=\"dbg-grid\">\n      <nav class=\"sheet dbg-list\" id=\"dbgList\" aria-label=\"{{taskList}}\"></nav>\n      <div class=\"sheet dbg-main\" id=\"dbgMain\"></div>\n    </div>\n  </section>\n\n  <!-- ===================== 7. quiz ===================== -->\n  <section class=\"tab\" id=\"tab-quiz\" role=\"tabpanel\" aria-labelledby=\"t-quiz\" hidden>\n    <div>\n      <h2 class=\"sec\">{{quizTitle}}</h2>\n      <p class=\"lead\">{{quizLead}}</p>\n    </div>\n    <div class=\"quiz\" id=\"quiz\"></div>\n  </section>\n\n  <!-- ===================== 8. tracer ===================== -->\n  <section class=\"tab\" id=\"tab-trace\" role=\"tabpanel\" aria-labelledby=\"t-trace\" hidden>\n    <div class=\"toolbar\">\n      <label class=\"sel\" for=\"preset\">{{presetLabel}} <select id=\"preset\"></select></label>\n      <button type=\"button\" class=\"btn\" id=\"editBtn\">✎ {{editCode}}</button>\n      <label class=\"toggle\" for=\"predictToggle\"><input type=\"checkbox\" id=\"predictToggle\"> {{predictMode}}</label>\n      <span class=\"kbd-help\"><span class=\"kbd\">←</span><span class=\"kbd\">→</span> {{kbdHelp}}</span>\n    </div>\n    <p class=\"focus\" id=\"focus\"></p>\n    <div class=\"trace-grid\">\n      <div class=\"code-col\">\n        <div class=\"sheet\">\n          <div class=\"sheet-head\"><h3>{{codeHead}}</h3><span class=\"chip\" id=\"lineHint\">{{lineHint}}</span></div>\n          <div class=\"code-view\" id=\"codeView\" aria-live=\"off\"></div>\n          <div class=\"editor\" id=\"editor\" hidden>\n            <textarea id=\"src\" spellcheck=\"false\" aria-label=\"Python\"></textarea>\n            <div class=\"row\">\n              <button type=\"button\" class=\"btn primary\" id=\"runBtn\">{{runTrace}} ▶</button>\n              <button type=\"button\" class=\"btn\" id=\"cancelEdit\">{{cancel}}</button>\n              <span class=\"hint\">{{editorHint}}</span>\n            </div>\n          </div>\n          <div class=\"inputs-row\" id=\"inputsRow\" hidden>\n            <label for=\"inputs\">{{simInput}}<small>{{simInputHint}}</small></label>\n            <textarea id=\"inputs\" rows=\"3\" spellcheck=\"false\"></textarea>\n            <button type=\"button\" class=\"btn small\" id=\"applyInputs\">{{applyInputs}}</button>\n          </div>\n        </div>\n        <div class=\"predict\" id=\"predictPanel\" hidden></div>\n        <div class=\"controls\" id=\"controls\">\n          <div class=\"row\">\n            <button type=\"button\" class=\"btn\" id=\"bReset\" title=\"Home\">⟲ <span class=\"lbl\">{{reset}}</span></button>\n            <button type=\"button\" class=\"btn\" id=\"bPrev\" title=\"←\">◀ <span class=\"lbl\">{{prev}}</span></button>\n            <button type=\"button\" class=\"btn primary\" id=\"bNext\" title=\"→\"><span class=\"lbl\">{{next}}</span> ▶</button>\n   const g = runBlock(parsed.ast, ctx);

}

function questionFor(k) {

  if (st.kind === 'cond') return { type: 'bool', prompt: S.pBool(st.line, CH(I.text)), answer: I.result ? 'True' : 'False' };
  if (st.kind === 'for' || st.kind === 'forEnd') return { type: 'for', prompt: S.pFor(st.line, CH(line), C(I.var)), answer: st.kind === 'forEnd' ? 'END' : I.value };

/* =================== 1. range() explorer (one value at a time) =================== */
const R = { form: 3, target: [], s: 0, timer: null };
const rIn = id => { const v = parseInt($(id).value, 10); return Number.isFinite(v) ? v : 0; };
function rParams() {
  const stop = rIn('#rStop');
  const start = R.form === 1 ? 0 : rIn('#rStart');
  const step = R.form === 3 ? rIn('#rStep') : 1;
  return { start, stop, step };
}
function rArgs() { const { start, stop, step } = rParams(); return R.form === 1 ? `${stop}` : R.form === 2 ? `${start}, ${stop}` : `${start}, ${stop}, ${step}`; }
function rangeList(s, e, st) {
  if (st === 0) return null;
  const a = [];
  if (st > 0) for (let v = s; v < e && a.length < 200; v += st) a.push(v);
  else for (let v = s; v > e && a.length < 200; v += st) a.push(v);
  return a;
}
const rMax = () => { const { start, stop, step } = rParams(); const v = rangeList(start, stop, step); return v === null ? 0 : v.length + 1; };
function rGo(s) { R.s = Math.max(0, Math.min(rMax(), s)); renderRange(); }
function rStopPlay() { if (R.timer) { clearInterval(R.timer); R.timer = null; $('#rPlay').innerHTML = `▷ ${S.autoplay}`; } }
function renderRange() {
  document.querySelectorAll('#rForm button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.form) === R.form)));
  $('#pStart').classList.toggle('off', R.form === 1);
  $('#pStep').classList.toggle('off', R.form !== 3);
  $('#rStart').disabled = R.form === 1; $('#pStart').querySelectorAll('button').forEach(b => { b.disabled = R.form === 1; });
  $('#rStep').disabled = R.form !== 3; $('#pStep').querySelectorAll('button').forEach(b => { b.disabled = R.form !== 3; });
  const { start, stop, step } = rParams();
  const vals = rangeList(start, stop, step);
  const max = vals === null ? 0 : vals.length + 1;
  R.s = Math.min(R.s, max);
  const shown = vals === null ? 0 : Math.min(R.s, vals.length);
  const finished = vals !== null && R.s === max;
  const cand = vals === null ? null : (vals.length ? vals[vals.length - 1] + step : start);
  const op = step > 0 ? '<' : '>';
  /* code with current value */
  const cur = shown >= 1 && !finished ? vals[shown - 1] : null;
  $('#rCode').innerHTML = hlBlock(`for i in range(${rArgs()}):\n    print(i)`) + (cur !== null ? `      <span class="c"># i = ${cur}</span>` : '');
  /* number line */
  let lo = Math.min(start, stop) - 1, hi = Math.max(start, stop) + 1;
  if (finished && cand !== null) { lo = Math.min(lo, cand); hi = Math.max(hi, cand); }
  let cells = '';
  for (let v = lo; v <= hi; v++) {
    const idx = vals ? vals.indexOf(v) : -1;
    const isStop = v === stop, isStart = v === start;
    let top = '';
    if (idx >= 0 && idx < shown) top = `<span class="dot${idx === shown - 1 && !finished ? ' now' : ''}" title="${esc(S.dotTitle(idx + 1))}">${idx + 1}</span>`;
    else if (finished && v === cand && !isStop) top = `<span class="cand" title="${esc(S.candTitle)}">✗</span>`;
    else if (isStop) top = `<span class="x" title="${esc(S.stopTitle)}">✕</span>`;
    const lab = [isStart ? '<span class="lab start">start</span>' : '', isStop ? '<span class="lab stop">stop</span>' : ''].filter(Boolean).join('');
    cells += `<div class="cell${idx >= 0 && idx < shown ? ' hit' : ''}${isStop ? ' stop' : ''}">${top || '<span></span>'}<span class="tick"></span><span class="num">${v}</span>${lab ? `<span style="display:grid">${lab}</span>` : '<span></span>'}</div>`;
  }
  $('#numline').innerHTML = cells;
  /* explanation of the current step */
  const ex = $('#rExplain');
  ex.className = 'r-explain';
  if (vals === null) { ex.classList.add('stop'); ex.innerHTML = `<p class="main"><b>ValueError</b>: ${S.rZeroStep}</p>`; }
  else if (R.s === 0) ex.innerHTML = `<p class="main">${S.rIdle}</p>`;
  else if (!finished) {
    const k = shown, v = vals[k - 1];
    const how = k === 1 ? S.rFirst(v) : S.rNextVal(vals[k - 2], step, v);
    ex.innerHTML = `<p class="main">${how}</p><div class="calc">${S.rCheck(v, op, stop, k)}</div>`;
  } else {
    ex.classList.add('stop');
    const how = vals.length === 0 ? S.rFirstCand(cand) : S.rNextVal(vals[vals.length - 1], step, cand);
    ex.innerHTML = `<p class="main">${how}</p><div class="calc">${S.rCheckFail(cand, op, stop)}</div>`;
  }
  /* running result */
  let res = '';
  if (vals !== null && R.s > 0) {
    res = `<div class="seq">${S.rSeqSoFar(vals.slice(0, shown).join(', ') + (finished ? '' : ' …'))}</div>`;
    if (finished) {
      if (!vals.length) res += `<p class="msg warn">${S.rEmpty}</p><p class="formula">${step > 0 ? S.rEmptyWhyPos(start, stop) : S.rEmptyWhyNeg(start, stop)}</p>`;
      else {
        const formula = step > 0 ? S.rFormulaPos(stop, start, step, vals.length) : S.rFormulaNeg(start, stop, -step, vals.length);
        res += `<p class="msg">${S.rIterCount(vals.length, vals[vals.length - 1], stop)}</p><p class="formula">${formula}</p>`;
      }
    }
  }
  $('#rResult').innerHTML = res;
  $('#rOut').textContent = vals ? vals.slice(0, shown).join('\n') : '';
  $('#rCount').textContent = vals === null ? '' : R.s === 0 ? S.rCountIdle(vals.length) : finished ? S.rCountDone(vals.length) : S.rCount(shown, vals.length);
  $('#rReset').disabled = $('#rPrev').disabled = R.s === 0;
  $('#rNext').disabled = $('#rAll').disabled = R.s >= max;
  $('#rPlay').disabled = R.s >= max && !R.timer;
  checkChallenge(vals);
}
function newChallenge() {
  let t;
  do {
    const stepsC = [-4, -3, -2, -1, 1, 2, 3, 4, 5];
    const st = stepsC[Math.floor(Math.random() * stepsC.length)];
    const s = Math.floor(Math.random() * 21) - 5;
    const n = 3 + Math.floor(Math.random() * 3);
    t = Array.from({ length: n }, (_, k) => s + k * st);
  } while (t.some(v => v < -25 || v > 25) || (R.target.length && t.join() === R.target.join()));
  R.target = t;
  $('#cTarget').textContent = t.join(', ');
  const { start, stop, step } = rParams();
  checkChallenge(rangeList(start, stop, step));
}
function checkChallenge(vals) {
  const ok = vals && vals.length === R.target.length && vals.every((v, k) => v === R.target[k]);
  const el = $('#cStatus');
  el.className = 'status' + (ok ? ' ok' : '');
  el.innerHTML = ok ? S.chOk(CH(`range(${rArgs()})`)) : (R.form === 3 ? S.chHint3 : S.chHint12);
}
const rChanged = () => { rStopPlay(); R.s = 0; renderRange(); };
document.querySelectorAll('#rForm button').forEach(b => b.addEventListener('click', () => { R.form = Number(b.dataset.form); rChanged(); }));
document.querySelectorAll('.stepper button').forEach(b => b.addEventListener('click', () => {
  const inp = $('#' + b.dataset.for);
  inp.value = Math.max(Number(inp.min), Math.min(Number(inp.max), (parseInt(inp.value, 10) || 0) + Number(b.dataset.d)));
  rChanged();
}));
['#rStart', '#rStop', '#rStep'].forEach(id => $(id).addEventListener('input', () => {
  const inp = $(id), v = parseInt(inp.value, 10);
  if (Number.isFinite(v)) { if (v > Number(inp.max)) inp.value = inp.max; if (v < Number(inp.min)) inp.value = inp.min; }
  rChanged();
}));
$('#rNext').addEventListener('click', () => { rStopPlay(); rGo(R.s + 1); });
$('#rPrev').addEventListener('click', () => { rStopPlay(); rGo(R.s - 1); });
$('#rReset').addEventListener('click', () => { rStopPlay(); rGo(0); });
$('#rAll').addEventListener('click', () => { rStopPlay(); rGo(rMax()); });
$('#rPlay').addEventListener('click', () => {
  if (R.timer) { rStopPlay(); renderRange(); return; }
  if (R.s >= rMax()) R.s = 0;
  $('#rPlay').innerHTML = `❚❚ ${S.pause}`;
  R.timer = setInterval(() => { if (R.s >= rMax()) { rStopPlay(); renderRange(); return; } rGo(R.s + 1); }, 900);
  rGo(R.s + 1);
});
$('#newChallenge').addEventListener('click', newChallenge);

/* =================== 2. What a for loop iterates over =================== */
const IT = { set: ITER_SETS[0].key, k: -1, res: null };
function itLoad(key) {
  IT.set = key; IT.k = -1;
  const set = ITER_SETS.find(s => s.key === key);
  IT.res = set.panels.map(p => trace(p.code, []));
  renderIter();
}
const itMax = () => Math.max(...IT.res.map(r => r.steps.length)) - 1;
function itGo(k) { IT.k = Math.max(-1, Math.min(itMax(), k)); renderIter(); }
function renderIter() {
  const set = ITER_SETS.find(s => s.key === IT.set);
  $('#itSeg').innerHTML = ITER_SETS.map(s => `<button type="button" data-set="${s.key}" aria-pressed="${s.key === IT.set}">${esc(s.label)}</button>`).join('');
  $('#itFocus').innerHTML = `<span class="tag">${S.observe}</span>${set.focus}`;
  $('#itCount').textContent = IT.k < 0 ? S.notStartedShort : S.stepN(IT.k + 1);
  $('#itReset').disabled = $('#itPrev').disabled = IT.k < 0;
  $('#itNext').disabled = $('#itEnd').disabled = IT.k >= itMax();
  const box = $('#itPanels');
  if (box.children.length !== set.panels.length || box.dataset.set !== IT.set) {
    box.dataset.set = IT.set;
    box.innerHTML = set.panels.map(() => '<div class="mini-panel"></div>').join('');
  }
  set.panels.forEach((p, q) => miniPanel(box.children[q], { res: IT.res[q], code: p.code, k: IT.k, title: `<span class="tagk">${esc(p.tag)}</span> ${esc(p.title)}`, strip: true }));
}
$('#itSeg').addEventListener('click', e => { const b = e.target.closest('[data-set]'); if (b) itLoad(b.dataset.set); });
$('#itNext').addEventListener('click', () => itGo(IT.k + 1));
$('#itPrev').addEventListener('click', () => itGo(IT.k - 1));
$('#itReset').addEventListener('click', () => itGo(-1));
$('#itEnd').addEventListener('click', () => itGo(itMax()));
(function renderIterNotes() {
  $('#itNotes').innerHTML = ITER_NOTES.map((n, i) => {
    const r = trace(n.code, []);
    const last = r.steps[r.steps.length - 1];
    const res = last.kind === 'error' ? `<div class="res-line err">${esc(last.info.type)}: ${esc(last.info.msg)}</div>` : `<div class="res-line">${esc(r.out.replace(/\n$/, '')).replace(/\n/g, '<br>')}</div>`;
    return `<div class="sheet mistake"><h3>${esc(n.title)}</h3><pre>${hlBlock(n.code)}</pre><span class="lab" style="margin:0">${S.resultLabel}</span>${res}<p>${n.text}</p><button type="button" class="btn small" data-note="${i}">${S.traceIt} ▶</button></div>`;
  }).join('');
  $('#itNotes').addEventListener('click', e => {
    const b = e.target.closest('[data-note]'); if (!b) return;
    const n = ITER_NOTES[Number(b.dataset.note)];
    openInTracer(n.code, n.text, { tab: 'iter', label: S.backIter });
  });
})();

/* =================== 3. for vs while =================== */
const LOADS = {
  for5: { code: 'for i in range(1, 6):\n    print(i)', focus: S.loadFor5Focus },
  while5: { code: 'i = 1\nwhile i < 6:\n    print(i)\n    i += 1', focus: S.loadWhile5Focus },

document.querySelectorAll('[data-load]').forEach(b => b.addEventListener('click', () => { const L = LOADS[b.dataset.load]; openInTracer(L.code, L.focus, { tab: 'compare', label: S.backCompare }); }));
const scenAns = new Array(SCENARIOS.length).fill(null);
function renderScen() {
  $('#scen').innerHTML = SCENARIOS.map((s, i) => {
    const a = scenAns[i];
    const btn = v => `<button type="button" class="btn small${a ? (v === s.ans ? ' right' : (a === v ? ' wrong' : '')) : ''}" data-s="${i}" data-v="${v}" ${a ? 'disabled' : ''}>${v}</button>`;
    return `<div class="scen-row"><div>${esc(s.text)}</div><div class="choice">${btn('for')}${btn('while')}</div>${a ? `<p class="fb">${a === s.ans ? '✓' : '✗'} ${esc(s.why)}</p>` : ''}</div>`;

$('#scen').addEventListener('click', e => { const b = e.target.closest('button[data-s]'); if (!b) return; scenAns[Number(b.dataset.s)] = b.dataset.v; renderScen(); });

/* =================== 4. break & continue =================== */
const BC = { pair: 'for', k: -1, res: null, code: null };
function bcLoad(key) {
  const P = BC_PAIRS[key];
  BC.pair = key; BC.k = -1;
  BC.code = { brk: P.brk, cnt: P.cnt };
  BC.res = { brk: trace(P.brk, []), cnt: trace(P.cnt, []) };
  renderBC();
}
const bcMax = () => Math.max(BC.res.brk.steps.length, BC.res.cnt.steps.length) - 1;
function bcGo(k) { BC.k = Math.max(-1, Math.min(bcMax(), k)); renderBC(); }
function renderBC() {
  $('#bcSeg').innerHTML = Object.entries(BC_PAIRS).map(([k, P]) => `<button type="button" data-pair="${k}" aria-pressed="${k === BC.pair}">${esc(P.label)}</button>`).join('');
  $('#bcFocus').innerHTML = `<span class="tag">${S.observe}</span>${BC_PAIRS[BC.pair].focus}`;
  $('#bcCount').textContent = BC.k < 0 ? S.notStartedShort : S.stepN(BC.k + 1);
  $('#bcReset').disabled = $('#bcPrev').disabled = BC.k < 0;
  $('#bcNext').disabled = $('#bcEnd').disabled = BC.k >= bcMax();
  miniPanel($('#bcBrk'), { res: BC.res.brk, code: BC.code.brk, k: BC.k, title: `<span class="tagk">break</span> ${S.versionLabel}` });
  miniPanel($('#bcCnt'), { res: BC.res.cnt, code: BC.code.cnt, k: BC.k, title: `<span class="tagk">continue</span> ${S.versionLabel}` });
}
$('#bcSeg').addEventListener('click', e => { const b = e.target.closest('[data-pair]'); if (b) bcLoad(b.dataset.pair); });
$('#bcNext').addEventListener('click', () => bcGo(BC.k + 1));
$('#bcPrev').addEventListener('click', () => bcGo(BC.k - 1));
$('#bcReset').addEventListener('click', () => bcGo(-1));
$('#bcEnd').addEventListener('click', () => bcGo(bcMax()));
document.querySelectorAll('[data-hl]').forEach(el => { el.innerHTML = hlBlock(PIT[el.dataset.hl]); });

/* =================== 5 & 6. Coding tasks and debugging (shared exercise engine) =================== */
function makeExercises(cfg) {
  const items = cfg.items;
  const X = { i: 0, codes: items.map(d => d.start), solved: new Set(), hints: items.map(() => 0), ans: items.map(() => false), result: items.map(() => null) };
  try {
    const saved = JSON.parse(store.get(cfg.key) || 'null');
    if (saved) {
      (saved.solved || []).forEach(i => { if (i < items.length) X.solved.add(i); });
      (saved.codes || []).forEach((c, i) => { if (typeof c === 'string' && i < items.length) X.codes[i] = c; });
    }
  } catch (e) { /* ignore */ }
  const save = () => store.set(cfg.key, JSON.stringify({ solved: [...X.solved], codes: X.codes }));
  const testsOf = d => d.tests || [[]];
  const expected = items.map(d => testsOf(d).map(t => trace(d.solution, t).out));
  function check(i) {
    const d = items[i], code = X.codes[i], tests = testsOf(d);
    for (let t = 0; t < tests.length; t++) {
      const r = trace(code, tests[t]);
      const last = r.steps[r.steps.length - 1];
      const exp = expected[i][t];
      let kind = null;
      if (r.error && r.error.syntax) kind = 'syntax';
      else if (last.kind === 'error') kind = 'error';
      else if (last.kind === 'limit') kind = 'limit';
      else if (last.kind === 'needInput') kind = 'input';
      else if (normOut(r.out) !== normOut(exp)) kind = 'diff';
      if (kind) return { ok: false, kind, r, exp, last, inputs: tests[t] };
    }
    const bare = code.split('\n').map(l => l.replace(/#.*/, '')).join('\n');
    if (d.require && !new RegExp('\\b' + d.require + '\\b').test(bare)) return { ok: false, kind: 'require', need: d.require };
    if (!/\b(for|while)\b/.test(bare)) return { ok: false, kind: 'noloop' };
    return { ok: true };
  }
  function diffTable(exp, act, limited) {
    const E = normOut(exp) === '' ? [] : normOut(exp).split('\n');
    const A = normOut(act) === '' ? [] : normOut(act).split('\n');
    const n = Math.max(E.length, A.length), show = Math.min(n, 14);
    let rows = '';
    for (let k = 0; k < show; k++) {
      const e = E[k], a = A[k];
      rows += `<tr class="${e !== a ? 'bad' : ''}"><td class="n">${k + 1}</td>`
        + (e === undefined ? `<td class="miss">${S.diffMissing}</td>` : `<td class="exp">${esc(e) || ' '}</td>`)
        + (a === undefined ? `<td class="miss">${S.diffMissing}</td>` : `<td class="act">${esc(a) || ' '}</td>`) + '</tr>';
    }
    if (n > show) rows += `<tr><td class="n">…</td><td class="miss" colspan="2">${limited ? S.diffEndless : S.diffMore(n - show)}</td></tr>`;
    if (!n) rows = `<tr><td class="n"></td><td class="miss" colspan="2">${S.diffNone}</td></tr>`;
    return `<div class="diff-wrap"><table class="diff"><thead><tr><th>${S.diffLine}</th><th>${S.diffExp}</th><th>${S.diffYours}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function resultHTML(i) {
    const R0 = X.result[i];
    if (!R0) return '';
    const d = items[i];
    if (R0.ok) return `<p class="verdict ok">${S.exOk(testsOf(d).length)}<small>${esc(d.explain)}</small></p>`;
    let head = '', sub = '';
    switch (R0.kind) {
      case 'syntax': head = S.exSyntax(R0.r.error.line, R0.r.error.type); sub = R0.r.error.msg; break;
      case 'error': head = S.exRunErr(R0.last.line, R0.last.info.type); sub = `${R0.last.info.msg}. ${S.errHelp[R0.last.info.type] || ''}`; break;
      case 'limit': head = S.exLimit; sub = S.exLimitWhy; break;
      case 'input': head = S.exInput; sub = S.exInputWhy; break;
      case 'diff': head = S.exDiff; sub = S.exDiffWhy; break;
      case 'require': head = S.exNeed(R0.need); break;
      case 'noloop': head = S.exNoLoop; break;
    }
    const inp = R0.inputs && R0.inputs.length ? `<small>${S.exTestIn(R0.inputs.map(C).join(S.listSep))}</small>` : '';
    const diff = ['diff', 'limit', 'error', 'input'].includes(R0.kind) ? diffTable(R0.exp, R0.r.out, R0.kind === 'limit') : '';
    return `<p class="verdict no">✗ ${head}${sub ? `<small>${esc(sub)}</small>` : ''}${inp}</p>${diff}`;
  }
  function render() {
    const N = items.length, i = X.i, d = items[i], tests = testsOf(d), nh = X.hints[i];
    $(cfg.list).innerHTML = `<div class="prog">${S.exDone(X.solved.size, N)}</div>` + items.map((q, k) =>
      `<button type="button" data-i="${k}" class="${k === i ? 'cur' : ''}"${k === i ? ' aria-current="true"' : ''}><span class="qn">${k + 1}</span><span class="qt">${esc(q.title)}</span><span class="st">${X.solved.has(k) ? '✓' : ''}</span></button>`).join('');
    const startSet = new Set(d.start.split('\n'));
    const answer = X.ans[i] ? `<div class="answer"><span class="lab" style="padding:10px 12px 0">${cfg.diffAnswer ? S.exAnsTitleDiff : S.exAnsTitle}</span><pre>${d.solution.split('\n').map(l => `<span class="aline${cfg.diffAnswer && !startSet.has(l) ? ' add' : ''}">${hl(l) || ' '}</span>`).join('')}</pre><p>${esc(d.explain)}</p></div>` : '';
    const sampleIn = tests[0].length ? `<p class="io-in">${S.exSampleIn(tests[0].map(C).join(S.listSep))}</p>` : '';
    const more = tests.length > 1 ? `<p class="tests-note">${S.exMoreTests(tests.length)}</p>` : '';
    $(cfg.main).innerHTML = `
      <div class="sheet-head"><h3>${S.exQ(i + 1, N, esc(d.title))}${d.require ? `<span class="req">${S.reqTag(d.require)}</span>` : ''}</h3>${X.solved.has(i) ? `<span class="chip t-true">${S.exSolved}</span>` : ''}</div>
      <div class="dbg-body">
        <p class="task"><span class="tag">${cfg.taskTag}</span>${d.problem}</p>
        <div class="dbg-cols">
          <div>
            <label class="lab" for="${cfg.prefix}Src">${cfg.codeLabel}</label>
            <textarea id="${cfg.prefix}Src" class="ex-src" spellcheck="false" rows="${Math.max(7, X.codes[i].split('\n').length + 3)}"></textarea>
            <div class="dbg-actions">
              <button type="button" class="btn primary" data-act="check">${S.exCheck} ▶</button>
              <button type="button" class="btn" data-act="trace">${S.exTraceMine}</button>
              <button type="button" class="btn" data-act="hint"${nh >= d.hints.length ? ' disabled' : ''}>${S.exHint(nh, d.hints.length)}</button>
              <button type="button" class="btn" data-act="reset">${cfg.resetLabel}</button>
            </div>
          </div>
          <div class="sample">
            <span class="lab">${S.exExpected}</span>
            ${sampleIn}
            <pre class="out expect">${esc(expected[i][0])}</pre>
            ${more}
          </div>
        </div>
        ${resultHTML(i)}
        ${nh ? `<ol class="hints">${d.hints.slice(0, nh).map((h, k) => `<li><b>${S.exHintN(k + 1)}</b>${esc(h)}</li>`).join('')}</ol>` : ''}
        ${answer}
        <div class="dbg-nav">
          <button type="button" class="btn" data-act="prev"${i === 0 ? ' disabled' : ''}>← ${S.exPrev}</button>
          <button type="button" class="btn small" data-act="answer">${X.ans[i] ? S.exAnsHide : S.exAnsShow}</button>
          <button type="button" class="btn" data-act="next"${i === N - 1 ? ' disabled' : ''}>${S.exNext} →</button>
        </div>
      </div>`;
    const ta = $(`#${cfg.prefix}Src`);
    ta.value = X.codes[i];
    ta.addEventListener('input', () => { X.codes[i] = ta.value; save(); });
    editorKeys(ta, () => act('check'));
  }
  function act(a) {
    const i = X.i, d = items[i];
    const ta = $(`#${cfg.prefix}Src`); if (ta) X.codes[i] = ta.value;
    if (a === 'check') { X.result[i] = check(i); if (X.result[i].ok) X.solved.add(i); save(); }
    else if (a === 'trace') { openInTracer(X.codes[i], `${cfg.traceFocus(i + 1)}${esc(d.problem)}`, { tab: cfg.tab, label: S.exBack(i + 1) }, testsOf(d)[0].join('\n')); return; }
    else if (a === 'hint') X.hints[i] = Math.min(d.hints.length, X.hints[i] + 1);
    else if (a === 'reset') { X.codes[i] = d.start; X.result[i] = null; save(); }
    else if (a === 'answer') X.ans[i] = !X.ans[i];
    else if (a === 'prev') X.i = Math.max(0, i - 1);
    else if (a === 'next') X.i = Math.min(items.length - 1, i + 1);
    render();
    if (a === 'check') { const v = document.querySelector(`${cfg.main} .verdict`); if (v && v.getBoundingClientRect().bottom > innerHeight) v.scrollIntoView({ block: 'nearest' }); }
  }
  $(cfg.main).addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act); });
  $(cfg.list).addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { const ta = $(`#${cfg.prefix}Src`); if (ta) X.codes[X.i] = ta.value; X.i = Number(b.dataset.i); render(); } });
  return { render, select(i) { X.i = i; render(); } };
}
const WR = makeExercises({ key: 'iter-write', tab: 'write', items: PROBLEMS, list: '#wrList', main: '#wrMain', prefix: 'wr', diffAnswer: false,
  codeLabel: S.exCodeLabelWr, resetLabel: S.exResetWr, taskTag: S.exTaskWr, traceFocus: S.exTraceFocusWr });
const DB = makeExercises({ key: 'iter-dbg', tab: 'debug', items: DEBUG.map(d => ({ ...d, start: d.buggy })), list: '#dbgList', main: '#dbgMain', prefix: 'dbg', diffAnswer: true,
  codeLabel: S.exCodeLabelDbg, resetLabel: S.exResetDbg, taskTag: S.exTaskDbg, traceFocus: S.exTraceFocusDbg });
document.querySelectorAll('[data-dbg]').forEach(b => b.addEventListener('click', () => { DB.select(Number(b.dataset.dbg)); switchTab('debug'); }));

/* =================== 7. Quiz =================== */
const Q = { i: 0, picks: new Array(QUIZ.length).fill(null), done: false };
function renderQuiz() {
  const box = $('#quiz');
  const nOk = Q.picks.filter((p, i) => p === QUIZ[i].answer).length, nDone = Q.picks.filter(p => p !== null).length;
  const dots = QUIZ.map((q, i) => `<button type="button" data-q="${i}" class="${i === Q.i && !Q.done ? 'cur ' : ''}${Q.picks[i] === null ? '' : Q.picks[i] === q.answer ? 'ok' : 'no'}" aria-label="${esc(S.qLabel(i + 1))}">${i + 1}</button>`).join('');
  let body;
  if (Q.done) {
    body = `<div class="qdone"><div class="big">${nOk} / ${QUIZ.length}</div><p style="margin:0">${nOk === QUIZ.length ? S.qAll : nOk >= QUIZ.length * 0.6 ? S.qGood : S.qLow}</p><button type="button" class="btn primary" data-restart>${S.qRestart}</button></div>`;
  } else {
    const q = QUIZ[Q.i], pick = Q.picks[Q.i];
    const opts = q.options.map((o, k) => {
      let cls = '';
      if (pick !== null) cls = k === q.answer ? ' right' : (k === pick ? ' wrong' : '');
      return `<button type="button" class="opt${cls}" data-o="${k}" ${pick !== null ? 'disabled' : ''}><span class="L">${'ABCD'[k]}</span><span class="T">${esc(o)}</span></button>`;
    }).join('');
    const after = pick !== null
      ? `<p class="qexplain">${pick === q.answer ? `<b>${S.qRight}</b>` : `<b>${S.qWrongAns('ABCD'[q.answer])}</b>`}${esc(q.explain)}</p>
         <div class="qactions"><button type="button" class="btn" data-tracq>${S.qVerify} ▶</button>${Q.i < QUIZ.length - 1 ? `<button type="button" class="btn primary" data-next>${S.qNext} →</button>` : `<button type="button" class="btn primary" data-finish>${S.qFinish}</button>`}</div>`
      : '';
    body = `<div class="qbody"><p class="qtext">${Q.i + 1}. ${esc(q.q)}</p><pre class="qcode">${hlBlock(q.code)}</pre><div class="opts">${opts}</div>${after}</div>`;
  }
  box.innerHTML = `<div class="sheet"><div class="sheet-head"><div class="qdots">${dots}</div><span class="chip">${S.qScore(nOk, nDone)}</span></div>${body}</div>`;
}
$('#quiz').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.q !== undefined) { Q.i = Number(b.dataset.q); Q.done = false; }
  else if (b.dataset.o !== undefined) Q.picks[Q.i] = Number(b.dataset.o);
  else if (b.hasAttribute('data-next')) Q.i++;
  else if (b.hasAttribute('data-finish')) Q.done = true;
  else if (b.hasAttribute('data-restart')) { Q.picks.fill(null); Q.i = 0; Q.done = false; }
  else if (b.hasAttribute('data-tracq')) { const q = QUIZ[Q.i]; openInTracer(q.code, `${S.qFocus(Q.i + 1)}${esc(q.explain)}`, { tab: 'quiz', label: S.backQuiz }); return; }
  renderQuiz();
});

}
